name: Daily motorhome search

on:
  schedule:
    # 06:40 UTC every day (07:40 BST / 06:40 GMT). GitHub may delay cron jobs by a few minutes.
    - cron: '40 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-search
  cancel-in-progress: false

jobs:
  search:
    # Scheduled runs are skipped until RUNNER_LABEL is set, so the schedule does not
    # fail every day on GitHub's blocked runners. Manual "Run workflow" always runs.
    if: github.event_name == 'workflow_dispatch' || vars.RUNNER_LABEL != ''
    # Autotrader blocks GitHub's own runners (HTTP 403), so this normally has to run
    # on a self-hosted runner. Set a repository variable RUNNER_LABEL (for example
    # "self-hosted") to pick it; see README "Where it runs".
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      # Only needed if Autotrader blocks the direct request and the browser fallback kicks in.
      # On a self-hosted runner install Chromium once by hand: npx playwright install chromium
      - run: npx playwright install --with-deps chromium
        if: runner.environment == 'github-hosted'

      - name: Run the search
        run: node src/run.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      # Only on success: a run that could not reach Autotrader must not overwrite good data.
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Daily search $(date -u +%Y-%m-%d)"
            git push
          fi

<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Motorhome search</title>
<meta name="description" content="The used quality-brand motorhomes closest to the brief, and what changed this week.">
<meta name="theme-color" content="#0d6b5c">
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e4e2dc;
    --accent: #0d6b5c; --yes: #0d6b5c; --no: #b4412c; --unk: #9a9893; --chip: #ecebe6;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15161a; --card: #1f2127; --ink: #ecebe6; --muted: #a3a29c; --line: #2f323a;
      --accent: #3fb59e; --yes: #3fb59e; --no: #e5765d; --unk: #777570; --chip: #2a2d35;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #15161a; --card: #1f2127; --ink: #ecebe6; --muted: #a3a29c; --line: #2f323a;
    --accent: #3fb59e; --yes: #3fb59e; --no: #e5765d; --unk: #777570; --chip: #2a2d35;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 26px; margin: 0; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin: 2px 0 0; font-size: 14px; }
  .brief { margin: 14px 0 0; font-size: 14px; color: var(--muted); }
  .tabs { display: flex; gap: 6px; margin: 20px 0 6px; background: var(--chip); padding: 4px; border-radius: 12px; }
  .tabs button { flex: 1; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 15px; padding: 9px 6px; border-radius: 9px; cursor: pointer; }
  .tabs button[aria-pressed="true"] { background: var(--card); box-shadow: var(--shadow); font-weight: 600; }
  .tabs b { font-weight: 600; color: var(--muted); margin-left: 4px; }
  .note { color: var(--muted); font-size: 14px; margin: 10px 2px 14px; }
  .list { display: grid; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; display: grid; grid-template-columns: 150px 1fr; text-decoration: none; color: inherit; }
  .card img { width: 100%; height: 100%; min-height: 120px; object-fit: cover; background: var(--chip); display: block; }
  .body { padding: 12px 14px; min-width: 0; }
  .title { font-weight: 600; margin: 0; line-height: 1.3; }
  .price { font-size: 20px; font-weight: 700; margin: 4px 0 0; }
  .price s { font-size: 14px; font-weight: 400; color: var(--muted); margin-left: 6px; }
  .cut { color: var(--no); font-size: 14px; font-weight: 600; margin-left: 6px; }
  .meta { color: var(--muted); font-size: 14px; margin: 2px 0 0; }
  .ticks { display: flex; flex-wrap: wrap; gap: 4px 10px; margin: 8px 0 0; padding: 0; list-style: none; font-size: 13px; }
  .ticks li.y { color: var(--yes); }
  .ticks li.n { color: var(--no); }
  .ticks li.u { color: var(--unk); }
  .tag { display: inline-block; font-size: 12px; font-weight: 600; background: var(--chip); border-radius: 999px; padding: 1px 8px; margin: 6px 6px 0 0; }
  .empty { color: var(--muted); text-align: center; padding: 30px 10px; }
  footer { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 14px; font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px 20px; }
  @media (max-width: 520px) {
    .card { grid-template-columns: 1fr; }
    .card img { height: 190px; }
  }
</style>
</head>
<body>
<main>
  <h1>Motorhome search</h1>
  <p class="sub" id="updated">Loading…</p>
  <p class="brief">Your brief: used, end lounge, up to 7.5 m, Alde or modern heating, self-levelling, air con a bonus. Quality brands only.</p>

  <div class="tabs" role="group" aria-label="View">
    <button type="button" data-tab="best" aria-pressed="true">Closest<b id="n-best"></b></button>
    <button type="button" data-tab="week" aria-pressed="false">This week<b id="n-week"></b></button>
  </div>
  <p class="note" id="note"></p>
  <div class="list" id="list"><p class="empty">Loading…</p></div>

  <footer>
    <a href="market.html">Market tracker</a>
    <a href="full.html">Full view with all filters</a>
  </footer>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const gbp = (n) => (n == null ? '' : '£' + Math.round(n).toLocaleString('en-GB'));
  const ITEMS = [['end lounge', 'End lounge'], ['up to 7.5 m', '≤ 7.5 m'], ['good heating', 'Heating'], ['self-levelling', 'Self-levelling']];
  let tab = 'best';
  try { tab = localStorage.getItem('simpleTab') || 'best'; } catch {}
  let best = [], week = [];

  function card(a, why) {
    const b = a.deal.brief;
    const ticks = ITEMS.map(([k, label]) => {
      const c = b.met.includes(k) ? 'y' : b.missing.includes(k) ? 'n' : 'u';
      return `<li class="${c}">${c === 'y' ? '✓' : c === 'n' ? '✗' : '?'} ${label}</li>`;
    });
    if (b.bonus.length) ticks.push('<li class="y">✓ Air con</li>');
    const h = a.priceHistory || [];
    const first = h[0]?.price;
    const cut = first && a.price < first ? `<span class="cut">−${gbp(first - a.price)}</span>` : '';
    const tags = [];
    if (why) tags.push(why);
    if (a.sellerType === 'PRIVATE') tags.push('Private seller');
    if (a.relisted) tags.push('Re-listed');
    const miles = a.mileage != null ? a.mileage.toLocaleString('en-GB') + ' miles' : '';
    const len = a.length?.metres ? a.length.metres.toFixed(2) + ' m' : '';
    return `<a class="card" href="${esc(a.url)}" target="_blank" rel="noopener">
      ${a.image ? `<img src="${esc(a.image)}" alt="" loading="lazy">` : '<img alt="">'}
      <div class="body">
        <p class="title">${esc(a.year || '')} ${esc(a.title)}</p>
        <p class="price">${gbp(a.price)}${cut}</p>
        <p class="meta">${[miles, len, esc(a.location || '')].filter(Boolean).join(' · ')}</p>
        <ul class="ticks">${ticks.join('')}</ul>
        ${tags.map((t) => `<span class="tag">${esc(t)}</span>`).join('')}
      </div>
    </a>`;
  }

  function render() {
    document.querySelectorAll('.tabs button').forEach((btn) => btn.setAttribute('aria-pressed', String(btn.dataset.tab === tab)));
    const rows = tab === 'best' ? best : week;
    $('note').textContent = tab === 'best'
      ? 'Used quality-brand vans that meet the brief, then those missing one thing. ✗ = the advert says no or lacks it, ? = the advert does not say.'
      : 'Used quality-brand vans listed or reduced in the last 7 days, closest to the brief first.';
    $('list').innerHTML = rows.length
      ? rows.map(([a, why]) => card(a, why)).join('')
      : `<p class="empty">${tab === 'best' ? 'Nothing meets the brief right now.' : 'Nothing new or reduced this week.'}</p>`;
  }

  document.querySelectorAll('.tabs button').forEach((btn) => btn.addEventListener('click', () => {
    tab = btn.dataset.tab;
    try { localStorage.setItem('simpleTab', tab); } catch {}
    render();
  }));

  fetch('data/dashboard.json', { cache: 'no-cache' }).then((r) => r.json()).then((data) => {
    const when = data.generatedAt ? new Date(data.generatedAt) : null;
    $('updated').textContent = when ? 'Last checked ' + when.toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
    const live = Object.values(data.adverts).filter((a) => a.status === 'active' && a.deal?.brief && !a.deal.brief.avoided && !a.newStock && !(a.redFlags || []).length);
    const fit = (a) => a.deal.brief.met.length + (a.deal.brief.bonus.length ? 0.5 : 0);
    const byFit = (x, y) => (y.deal.brief.ok - x.deal.brief.ok) || (fit(y) - fit(x)) || ((y.deal.pickScore || 0) - (x.deal.pickScore || 0));

    best = live.filter((a) => a.deal.brief.ok || a.deal.brief.near).sort(byFit)
      .map((a) => [a, a.deal.brief.ok ? 'Meets the brief' : '']);

    const since = new Date(Date.now() - 7 * 864e5).toISOString().slice(0, 10);
    week = [];
    for (const a of live) {
      const h = a.priceHistory || [];
      const cutDay = h.length > 1 && h.at(-1).price < h.at(-2).price ? h.at(-1).date : null;
      if (cutDay && cutDay >= since) week.push([a, 'Reduced ' + gbp(h.at(-2).price - h.at(-1).price)]);
      else if ((a.listedDate || a.firstSeen) >= since) week.push([a, 'New']);
    }
    week.sort((x, y) => byFit(x[0], y[0]));

    $('n-best').textContent = best.length;
    $('n-week').textContent = week.length;
    render();
  }).catch(() => { $('list').innerHTML = '<p class="empty">Could not load the data. Try again shortly.</p>'; });
})();
</script>
</body>
</html>

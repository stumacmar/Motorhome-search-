<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motorhome search</title>
<meta name="description" content="Adverts matched by the daily Autotrader motorhome search, with price history.">
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e4e2dc;
    --accent: #0d6b5c; --accent-ink: #ffffff; --new: #0d6b5c; --drop: #b4412c; --gone: #9a9893;
    --chip: #ecebe6; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15161a; --card: #1f2127; --ink: #ecebe6; --muted: #a3a29c; --line: #2f323a;
      --accent: #3fb59e; --accent-ink: #0d1412; --new: #3fb59e; --drop: #e5765d; --gone: #777570;
      --chip: #2a2d35; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #15161a; --card: #1f2127; --ink: #ecebe6; --muted: #a3a29c; --line: #2f323a;
    --accent: #3fb59e; --accent-ink: #0d1412; --new: #3fb59e; --drop: #e5765d; --gone: #777570;
    --chip: #2a2d35; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); }
  header { padding: 28px 16px 8px; max-width: 1180px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin: 0; }
  main { max-width: 1180px; margin: 0 auto; padding: 0 16px 48px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 18px 0; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .stat b { display: block; font-size: 24px; line-height: 1.1; }
  .stat span { color: var(--muted); font-size: 13px; }
  .stat.new b { color: var(--new); } .stat.drop b { color: var(--drop); }
  .searches { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
  .searches a { font-size: 13px; color: var(--muted); text-decoration: none; }
  .searches .warn { color: var(--drop); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 18px; position: sticky; top: 0; background: var(--bg); padding: 10px 0; z-index: 2; }
  select, input[type=search] { background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; }
  input[type=search] { flex: 1 1 180px; min-width: 0; }
  .toggle { display: inline-flex; gap: 2px; background: var(--chip); border-radius: 8px; padding: 2px; }
  .toggle button { border: 0; background: transparent; color: var(--muted); padding: 6px 10px; border-radius: 6px; font: inherit; font-size: 13px; cursor: pointer; }
  .toggle button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; }
  .card.gone { opacity: .55; }
  .card img, .card .noimg { width: 100%; aspect-ratio: 4/3; object-fit: cover; background: var(--chip); display: block; }
  .card .noimg { display: grid; place-items: center; color: var(--muted); font-size: 13px; }
  .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .title { font-weight: 600; font-size: 16px; line-height: 1.3; }
  .title a { color: inherit; text-decoration: none; }
  .title a:hover { text-decoration: underline; }
  .subtitle { color: var(--muted); font-size: 13px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .price { font-size: 20px; font-weight: 700; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .price s { color: var(--muted); font-weight: 400; font-size: 14px; }
  .price .delta { font-size: 13px; font-weight: 600; color: var(--drop); }
  .price .delta.up { color: var(--muted); }
  .meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 6px; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); }
  .tag.new { background: var(--new); color: var(--accent-ink); }
  .tag.drop { background: var(--drop); color: #fff; }
  .tag.gone { background: var(--gone); color: #fff; }
  details { font-size: 13px; color: var(--muted); }
  details summary { cursor: pointer; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  footer { color: var(--muted); font-size: 13px; max-width: 1180px; margin: 0 auto; padding: 0 16px 32px; }
</style>
</head>
<body>
<header>
  <h1>Motorhome search</h1>
  <p class="sub" id="updated">Loading…</p>
</header>
<main>
  <div class="stats" id="stats"></div>
  <div class="searches" id="searches"></div>
  <div class="controls">
    <input type="search" id="q" placeholder="Filter by make, model, location…" aria-label="Filter adverts">
    <select id="search" aria-label="Search"><option value="">All searches</option></select>
    <select id="sort" aria-label="Sort">
      <option value="newest">Newest first</option>
      <option value="price-asc">Price: low to high</option>
      <option value="price-desc">Price: high to low</option>
      <option value="drop">Biggest price drop</option>
      <option value="year">Year: newest</option>
      <option value="mileage">Mileage: lowest</option>
      <option value="distance">Distance: nearest</option>
    </select>
    <div class="toggle" role="group" aria-label="Show">
      <button data-show="active" aria-pressed="true">Live</button>
      <button data-show="new" aria-pressed="false">New this week</button>
      <button data-show="drops" aria-pressed="false">Price drops</button>
      <button data-show="gone" aria-pressed="false">Gone</button>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>Nothing matches.</p>
</main>
<footer>Data is refreshed once a day by a GitHub Actions job. Adverts link to Autotrader; prices and availability are theirs, not ours.</footer>
<script>
(async function () {
  const gbp = (n) => n == null ? '?' : '£' + Number(n).toLocaleString('en-GB');
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const daysAgo = (d) => Math.floor((Date.now() - new Date(d + 'T12:00:00Z')) / 864e5);

  let data;
  try {
    const res = await fetch('data/listings.json?' + Date.now());
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
  } catch (e) {
    document.getElementById('updated').textContent = 'No data yet. Run the workflow once (Actions → Daily motorhome search → Run workflow).';
    return;
  }

  const adverts = Object.values(data.adverts || {});
  const today = new Date().toISOString().slice(0, 10);
  for (const a of adverts) {
    const h = a.priceHistory || [];
    a._first = h[0]?.price ?? a.price;
    a._last = h.at(-1)?.price ?? a.price;
    a._drop = a._first != null && a._last != null ? a._first - a._last : 0;
    a._recentDrop = h.length > 1 && daysAgo(h.at(-1).date) <= 7 && h.at(-1).price < h.at(-2).price;
    a._isNew = daysAgo(a.firstSeen) <= 7;
  }

  const gen = data.generatedAt ? new Date(data.generatedAt) : null;
  document.getElementById('updated').textContent = gen
    ? 'Last checked ' + gen.toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })
    : '';

  const live = adverts.filter((a) => a.status === 'active');
  const stats = [
    ['live', live.length, 'live adverts'],
    ['new', live.filter((a) => a._isNew).length, 'new this week'],
    ['drop', live.filter((a) => a._recentDrop).length, 'price drops this week'],
    ['gone', adverts.filter((a) => a.status === 'gone' && daysAgo(a.goneSince) <= 7).length, 'gone this week'],
  ];
  document.getElementById('stats').innerHTML = stats.map(([c, n, l]) => `<div class="stat ${c}"><b>${n}</b><span>${l}</span></div>`).join('');

  const searches = Object.values(data.searches || {});
  document.getElementById('searches').innerHTML = searches.map((s) =>
    `<a href="${esc(s.url || '#')}" target="_blank" rel="noopener" class="${s.error || s.truncated ? 'warn' : ''}" title="${esc(s.error || (s.truncated ? 'Only the first ' + s.read + ' of ' + s.total + ' results were read' : 'Open on Autotrader'))}">
      ${s.error ? '⚠️ ' : ''}${esc(s.name)} · ${s.error ? 'failed' : s.total + ' on Autotrader'}${s.truncated ? ' (cut short)' : ''}</a>`).join('');
  const sel = document.getElementById('search');
  for (const s of searches) sel.insertAdjacentHTML('beforeend', `<option value="${esc(s.name)}">${esc(s.name)}</option>`);

  const state = { q: '', search: '', sort: 'newest', show: 'active' };
  try { Object.assign(state, JSON.parse(localStorage.getItem('mh-view') || '{}')); } catch {}
  document.getElementById('q').value = state.q;
  document.getElementById('sort').value = state.sort;
  if ([...sel.options].some((o) => o.value === state.search)) sel.value = state.search; else state.search = '';
  document.querySelectorAll('.toggle button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.show === state.show)));

  function card(a) {
    const tags = [];
    if (a.status === 'gone') tags.push(`<span class="tag gone">gone ${a.goneSince ? daysAgo(a.goneSince) + 'd ago' : ''}</span>`);
    else if (a._isNew) tags.push(`<span class="tag new">new ${a.firstSeen === today ? 'today' : daysAgo(a.firstSeen) + 'd ago'}</span>`);
    if (a._recentDrop) tags.push(`<span class="tag drop">price drop</span>`);
    for (const s of a.searches || []) tags.push(`<span class="tag">${esc(s)}</span>`);
    const hist = (a.priceHistory || []).length > 1
      ? `<details><summary>Price history</summary>${a.priceHistory.map((p) => `${p.date}: ${gbp(p.price)}`).join('<br>')}</details>` : '';
    const delta = a._drop > 0 ? `<s>${gbp(a._first)}</s><span class="delta">−${gbp(a._drop)}</span>`
      : a._drop < 0 ? `<s>${gbp(a._first)}</s><span class="delta up">+${gbp(-a._drop)}</span>` : '';
    return `<article class="card ${a.status === 'gone' ? 'gone' : ''}">
      ${a.image ? `<a href="${esc(a.url)}" target="_blank" rel="noopener"><img src="${esc(a.image)}" alt="" loading="lazy"></a>` : '<div class="noimg">No photo</div>'}
      <div class="body">
        <div class="title"><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
        ${a.subTitle ? `<div class="subtitle">${esc(a.subTitle)}</div>` : ''}
        <div class="price">${gbp(a._last)} ${delta}</div>
        <div class="meta">
          ${a.registeredYear || a.year ? `<span>${esc(a.registeredYear || a.year)}</span>` : ''}
          ${a.mileageText ? `<span>${esc(a.mileageText)}</span>` : ''}
          ${a.location ? `<span>${esc(a.location)}</span>` : ''}
          ${a.sellerType ? `<span>${a.sellerType === 'PRIVATE' ? 'Private' : 'Trade'}</span>` : ''}
        </div>
        ${hist}
        <div class="tags">${tags.join('')}</div>
      </div>
    </article>`;
  }

  function render() {
    const q = state.q.trim().toLowerCase();
    let list = adverts.filter((a) => {
      if (state.show === 'gone') { if (a.status !== 'gone') return false; }
      else if (a.status !== 'active') return false;
      if (state.show === 'new' && !a._isNew) return false;
      if (state.show === 'drops' && !a._recentDrop) return false;
      if (state.search && !(a.searches || []).includes(state.search) && !(a.status === 'gone')) return false;
      if (q && ![a.title, a.subTitle, a.make, a.model, a.location].join(' ').toLowerCase().includes(q)) return false;
      return true;
    });
    const by = {
      newest: (x, y) => (y.firstSeen || '').localeCompare(x.firstSeen || '') || y.id.localeCompare(x.id),
      'price-asc': (x, y) => (x._last ?? 1e12) - (y._last ?? 1e12),
      'price-desc': (x, y) => (y._last ?? -1) - (x._last ?? -1),
      drop: (x, y) => y._drop - x._drop,
      year: (x, y) => (y.year ?? 0) - (x.year ?? 0),
      mileage: (x, y) => (x.mileage ?? 1e12) - (y.mileage ?? 1e12),
      distance: (x, y) => (x.distanceMiles ?? 1e12) - (y.distanceMiles ?? 1e12),
    };
    list.sort(by[state.sort] || by.newest);
    document.getElementById('grid').innerHTML = list.map(card).join('');
    document.getElementById('empty').hidden = list.length > 0;
    try { localStorage.setItem('mh-view', JSON.stringify(state)); } catch {}
  }

  document.getElementById('q').addEventListener('input', (e) => { state.q = e.target.value; render(); });
  sel.addEventListener('change', (e) => { state.search = e.target.value; render(); });
  document.getElementById('sort').addEventListener('change', (e) => { state.sort = e.target.value; render(); });
  document.querySelectorAll('.toggle button').forEach((b) => b.addEventListener('click', () => {
    state.show = b.dataset.show;
    document.querySelectorAll('.toggle button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    render();
  }));
  render();
})();
</script>
</body>
</html>
